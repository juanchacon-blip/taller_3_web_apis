# Credenciales de DESARROLLO. En un entorno real no se versionan: créalos con
# `kubectl create secret` o un gestor de secretos.
# Las llaves RSA (secret "jwt-keys") las crea scripts/deploy-k8s.sh.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: microservicios
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-credentials
  namespace: microservicios
type: Opaque
stringData:
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: Admin12345!
