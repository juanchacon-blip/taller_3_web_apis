apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: microservicios
spec:
  replicas: 1   # súbelo con: kubectl scale deployment/task-service --replicas=2 -n microservicios
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: task-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/taskdb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: JWT_ISSUER
              value: auth-service
            - name: JWT_JWKS_URI
              value: http://auth-service:8081/.well-known/jwks.json
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: microservicios
spec:
  type: NodePort
  selector:
    app: task-service
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
