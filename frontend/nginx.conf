server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_set_header Origin "";
        proxy_pass http://auth-service:8081;
    }

    location /api/tasks {
        proxy_set_header Origin "";
        proxy_pass http://task-service:8082;
    }

    location / {
        try_files $uri /index.html;
    }
}
