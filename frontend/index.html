<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de tareas</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1f2a2e; --muted: #6b777b;
    --accent: #0f6b5c; --accent-ink: #ffffff; --danger: #b3372b; --line: #e2dccf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14191b; --card: #1d2427; --ink: #e8efef; --muted: #8fa0a4;
      --accent: #3fb9a3; --accent-ink: #06201b; --danger: #ef7d70; --line: #2c373b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 16px;
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: inherit; font: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 14px;
    border: 1px solid var(--line); background: transparent; color: inherit;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.small { padding: 4px 10px; font-size: .85rem; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs button[aria-selected=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .msg { margin: 12px 0 0; font-size: .9rem; min-height: 1.2em; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--accent); }
  .muted { color: var(--muted); font-size: .85rem; }
  .badge {
    display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--muted); vertical-align: middle;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li.task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
  li.task:first-child { border-top: 0; }
  li.task .body { flex: 1; min-width: 0; }
  li.task .title { font-weight: 600; overflow-wrap: anywhere; }
  li.task.done .title { text-decoration: line-through; color: var(--muted); }
  li.task .desc { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; white-space: pre-wrap; }
  li.task input[type=checkbox] { margin-top: 6px; width: 18px; height: 18px; accent-color: var(--accent); }
  .actions { display: flex; gap: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gestor de tareas</h1>
    <div id="userbox" class="row hidden">
      <span id="whoami" class="muted"></span>
      <button id="logout" class="small">Cerrar sesión</button>
    </div>
  </header>

  <!-- Vista de acceso -->
  <section id="auth-view" class="card">
    <div class="tabs" role="tablist">
      <button id="tab-login" role="tab" aria-selected="true">Iniciar sesión</button>
      <button id="tab-register" role="tab" aria-selected="false">Crear cuenta</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label for="username">Usuario</label>
      <input id="username" type="text" autocomplete="username" required minlength="3" maxlength="50">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="100">
      <p class="muted" id="auth-hint" style="margin:8px 0 0"></p>
      <div class="row" style="margin-top:14px">
        <button id="auth-submit" type="submit" class="primary">Entrar</button>
      </div>
      <p id="auth-msg" class="msg" role="status"></p>
    </form>
  </section>

  <!-- Vista de tareas -->
  <section id="tasks-view" class="hidden">
    <form id="new-task" class="card">
      <h2>Nueva tarea</h2>
      <label for="new-title">Título</label>
      <input id="new-title" type="text" required maxlength="120">
      <label for="new-desc">Descripción (opcional)</label>
      <textarea id="new-desc" maxlength="1000"></textarea>
      <div class="row" style="margin-top:12px">
        <button type="submit" class="primary">Agregar</button>
      </div>
    </form>

    <div class="card">
      <h2>Mis tareas <span id="count" class="muted"></span></h2>
      <ul id="list"></ul>
      <p id="empty" class="muted hidden">Todavía no hay tareas.</p>
      <p id="tasks-msg" class="msg" role="status"></p>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var state = { mode: "login", tasks: [], editingId: null, admin: false };

  // ---- token (localStorage puede no estar disponible) ----
  function getToken() { try { return localStorage.getItem("token"); } catch (e) { return null; } }
  function setToken(t) {
    try { if (t) localStorage.setItem("token", t); else localStorage.removeItem("token"); } catch (e) {}
  }
  function decode(token) {
    try {
      var p = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(p));
    } catch (e) { return null; }
  }

  // ---- llamadas a la API (nginx las redirige a auth-service y task-service) ----
  function api(path, options) {
    options = options || {};
    var headers = { "Content-Type": "application/json" };
    var token = getToken();
    if (token) headers["Authorization"] = "Bearer " + token;
    return fetch(path, { method: options.method || "GET", headers: headers, body: options.body })
      .then(function (res) {
        if (res.status === 204) return null;
        return res.text().then(function (text) {
          var data = null;
          try { data = text ? JSON.parse(text) : null; } catch (e) {}
          if (!res.ok) {
            var err = new Error((data && data.message) || "Error " + res.status);
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
  }

  function setMsg(el, text, kind) {
    el.textContent = text || "";
    el.className = "msg" + (kind ? " " + kind : "");
  }

  // ---- vistas ----
  function showAuth() {
    $("#auth-view").classList.remove("hidden");
    $("#tasks-view").classList.add("hidden");
    $("#userbox").classList.add("hidden");
  }
  function showTasks() {
    var claims = decode(getToken());
    var roles = (claims && claims.roles) || [];
    state.admin = roles.indexOf("ADMIN") !== -1;
    $("#whoami").textContent = (claims ? claims.sub : "") + (state.admin ? " (admin)" : "");
    $("#auth-view").classList.add("hidden");
    $("#tasks-view").classList.remove("hidden");
    $("#userbox").classList.remove("hidden");
    loadTasks();
  }
  function logout(message) {
    setToken(null);
    state.tasks = [];
    state.editingId = null;
    showAuth();
    setMsg($("#auth-msg"), message || "", message ? "error" : "");
  }

  function setMode(mode) {
    state.mode = mode;
    var login = mode === "login";
    $("#tab-login").setAttribute("aria-selected", login);
    $("#tab-register").setAttribute("aria-selected", !login);
    $("#auth-submit").textContent = login ? "Entrar" : "Crear cuenta";
    $("#password").setAttribute("autocomplete", login ? "current-password" : "new-password");
    $("#auth-hint").textContent = login ? "" : "Usuario: mínimo 3 caracteres. Contraseña: mínimo 8.";
    setMsg($("#auth-msg"), "");
  }

  // ---- autenticación ----
  function login(username, password) {
    return api("/api/auth/login", { method: "POST", body: JSON.stringify({ username: username, password: password }) })
      .then(function (data) { setToken(data.access_token); showTasks(); });
  }

  $("#tab-login").addEventListener("click", function () { setMode("login"); });
  $("#tab-register").addEventListener("click", function () { setMode("register"); });

  $("#auth-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var username = $("#username").value.trim();
    var password = $("#password").value;
    var msg = $("#auth-msg");
    setMsg(msg, "");

    var action;
    if (state.mode === "register") {
      action = api("/api/auth/register", { method: "POST", body: JSON.stringify({ username: username, password: password }) })
        .then(function () { return login(username, password); });
    } else {
      action = login(username, password);
    }
    action.then(function () { $("#password").value = ""; })
      .catch(function (err) {
        if (err.status === 401) setMsg(msg, "Usuario o contraseña incorrectos.", "error");
        else if (err.status === 409) setMsg(msg, "Ese usuario ya existe.", "error");
        else if (err.status === 400) setMsg(msg, "Revisa los datos: usuario mínimo 3 caracteres y contraseña mínimo 8.", "error");
        else setMsg(msg, "No se pudo conectar con el servidor.", "error");
      });
  });

  $("#logout").addEventListener("click", function () { logout(); });

  // ---- tareas ----
  function handleTaskError(err) {
    if (err.status === 401) return logout("Tu sesión expiró. Inicia sesión de nuevo.");
    setMsg($("#tasks-msg"), err.status === 404 ? "La tarea ya no existe." : "No se pudo completar la acción.", "error");
    if (err.status === 404) loadTasks();
  }

  function loadTasks() {
    api("/api/tasks").then(function (tasks) {
      state.tasks = tasks;
      setMsg($("#tasks-msg"), "");
      render();
    }).catch(handleTaskError);
  }

  function updateTask(t, changes) {
    var body = {
      title: changes.title !== undefined ? changes.title : t.title,
      description: changes.description !== undefined ? changes.description : t.description,
      completed: changes.completed !== undefined ? changes.completed : t.completed
    };
    return api("/api/tasks/" + t.id, { method: "PUT", body: JSON.stringify(body) });
  }

  $("#new-task").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("#new-title").value.trim();
    var desc = $("#new-desc").value.trim();
    if (!title) return;
    api("/api/tasks", { method: "POST", body: JSON.stringify({ title: title, description: desc || null, completed: false }) })
      .then(function () {
        $("#new-title").value = "";
        $("#new-desc").value = "";
        loadTasks();
      }).catch(handleTaskError);
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function button(label, cls, onClick) {
    var b = el("button", cls, label);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }

  function render() {
    var list = $("#list");
    list.innerHTML = "";
    $("#count").textContent = state.tasks.length ? "(" + state.tasks.length + ")" : "";
    $("#empty").classList.toggle("hidden", state.tasks.length > 0);

    state.tasks.forEach(function (t) {
      var li = el("li", "task" + (t.completed ? " done" : ""));

      if (state.editingId === t.id) {
        var form = el("div", "body");
        var title = el("input"); title.type = "text"; title.value = t.title; title.maxLength = 120;
        var desc = el("textarea"); desc.value = t.description || ""; desc.maxLength = 1000;
        var row = el("div", "row"); row.style.marginTop = "8px";
        row.appendChild(button("Guardar", "primary small", function () {
          if (!title.value.trim()) return;
          updateTask(t, { title: title.value.trim(), description: desc.value.trim() || null })
            .then(function () { state.editingId = null; loadTasks(); })
            .catch(handleTaskError);
        }));
        row.appendChild(button("Cancelar", "small", function () { state.editingId = null; render(); }));
        form.appendChild(title); form.appendChild(desc); form.appendChild(row);
        li.appendChild(form);
      } else {
        var check = el("input"); check.type = "checkbox"; check.checked = t.completed;
        check.setAttribute("aria-label", "Marcar como completada");
        check.addEventListener("change", function () {
          updateTask(t, { completed: check.checked }).then(loadTasks).catch(handleTaskError);
        });

        var body = el("div", "body");
        var head = el("div", "title", t.title);
        if (state.admin) { head.appendChild(document.createTextNode(" ")); head.appendChild(el("span", "badge", t.owner)); }
        body.appendChild(head);
        if (t.description) body.appendChild(el("div", "desc", t.description));

        var actions = el("div", "actions");
        actions.appendChild(button("Editar", "small", function () { state.editingId = t.id; render(); }));
        actions.appendChild(button("Borrar", "small danger", function () {
          if (!confirm("¿Borrar esta tarea?")) return;
          api("/api/tasks/" + t.id, { method: "DELETE" }).then(loadTasks).catch(handleTaskError);
        }));

        li.appendChild(check); li.appendChild(body); li.appendChild(actions);
      }
      list.appendChild(li);
    });
  }

  // ---- arranque ----
  setMode("login");
  var existing = getToken();
  var claims = existing && decode(existing);
  if (claims && claims.exp * 1000 > Date.now()) showTasks(); else { setToken(null); showAuth(); }
})();
</script>
</body>
</html>
